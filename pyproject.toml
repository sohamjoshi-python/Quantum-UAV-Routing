[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-uav-routing"
version = "0.1.0"
description = "Quantum and classical optimization for UAV routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scipy",
  "networkx",
  "dimod",
  "geopandas",
  "shapely",
  "h3",
  "folium",
  "pulp",
  "qiskit",
  "qiskit-ibm-runtime",
  "qiskit-optimization",
  "dwave-samplers",
  "python-dotenv",
  "seaborn"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]